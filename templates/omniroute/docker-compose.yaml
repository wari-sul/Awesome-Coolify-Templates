services:
  omniroute:
    image: 'diegosouzapw/omniroute:3.8.49-web'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SERVICE_URL_OMNIROUTE_20128
      - 'NODE_ENV=${NODE_ENV:-production}'
      - 'HOSTNAME=${HOSTNAME:-0.0.0.0}'
      - DATA_DIR=/app/data
      - 'PORT=${PORT:-20128}'
      - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
      - 'API_PORT=${API_PORT:-20129}'
      - 'API_HOST=${API_HOST:-0.0.0.0}'
      - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
      - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379}'
      - 'OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}'
      - 'BASE_URL=${BASE_URL:-http://omniroute:20128}'
      - 'NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:?https://your-domain.com}'
      - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
      - JWT_SECRET=$SERVICE_REALBASE64_64_OMNIROUTE
      - API_KEY_SECRET=$SERVICE_HEX_32_OMNIROUTE
      - INITIAL_PASSWORD=$SERVICE_PASSWORD_64_OMNIROUTE
      - OMNIROUTE_WS_BRIDGE_SECRET=$SERVICE_REALBASE64_64_OMNIROUTE
      - 'STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-}'
      - 'STORAGE_ENCRYPTION_KEY_VERSION=${STORAGE_ENCRYPTION_KEY_VERSION:-v1}'
      - 'MACHINE_ID_SALT=${MACHINE_ID_SALT:-}'
      - 'APP_LOG_TO_FILE=${APP_LOG_TO_FILE:-true}'
      - 'AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}'
      - 'OMNIROUTE_TRUST_PROXY=${OMNIROUTE_TRUST_PROXY:-false}'
      - 'REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}'
      - 'OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-512}'
    volumes:
      - 'omniroute-data:/app/data'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: 'redis:7-alpine'
    command: 'redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru'
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  omniroute-data:
  redis-data:
