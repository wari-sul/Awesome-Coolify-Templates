services:
  omniroute:
    image: 'diegosouzapw/omniroute:latest'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Caps Docker container memory usage
    mem_limit: 512M
    environment:
      # ── Coolify Magic Domains (UI Inputs) ──
      - SERVICE_URL_OMNIROUTE_20128
      - SERVICE_URL_OMNIROUTE_20129
      
      # ── 1. Security & Auth (Auto-Generated by Coolify) ──
      - 'JWT_SECRET=${SERVICE_BASE64_JWT}'
      - 'API_KEY_SECRET=${SERVICE_BASE64_API}'
      - 'INITIAL_PASSWORD=${SERVICE_PASSWORD_ADMIN}'
      - 'STORAGE_ENCRYPTION_KEY=${SERVICE_BASE64_STORAGE}'
      
      # ── 2. Reverse Proxy & Network ──
      - 'NEXT_PUBLIC_BASE_URL=${SERVICE_URL_OMNIROUTE_20128}'
      - 'AUTH_COOKIE_SECURE=true'
      # Fixes IPv6 DNS timeout issues in Node.js on dual-stack VPS
      - 'NODE_OPTIONS=--dns-result-order=ipv4first'
      
      # ── 3. Low-RAM Overrides (<1GB VPS limit) ──
      - 'OMNIROUTE_MEMORY_MB=256'
      - 'APP_LOG_TO_FILE=false'
      - 'APP_LOG_LEVEL=warn'
      - 'PROMPT_CACHE_MAX_BYTES=1048576'
      - 'SEMANTIC_CACHE_MAX_BYTES=2097152'
      
      # ── 4. Core Configuration ──
      - 'NODE_ENV=production'
      - 'DATA_DIR=/app/data'
      - 'PORT=20128'
      - 'DASHBOARD_PORT=20128'
      - 'API_PORT=20129'
      - 'API_HOST=0.0.0.0'
      - 'HOSTNAME=0.0.0.0'
      - 'REDIS_URL=redis://redis:6379'
    volumes:
      - 'omniroute-data:/app/data'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    mem_limit: 128M
    command: 
      - redis-server 
      - '--save'
      - '60'
      - '1'
      - '--loglevel'
      - 'warning'
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  omniroute-data:
    name: omniroute-prod-data
  redis-data:
    name: omniroute-redis-data
